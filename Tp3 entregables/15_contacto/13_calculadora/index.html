<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Basica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Calculadora Basica</h1>

  <div class="selector-tema">
    <label for="tema">Estilo:</label>
    <select id="tema" onchange="cambiarTema(this.value)">
      <option value="mate">Clásica</option>
      <option value="neon">Oscuro Neón</option>
    </select>
  </div>

  <div class="calculadora">

    <!-- Pantalla -->
    <div class="pantalla">
      <div id="operacionAnterior" class="operacion-anterior"></div>
      <div id="pantallaActual" class="pantalla-actual">0</div>
    </div>

    <!-- Botones -->
    <div class="botones">
      <button class="btn naranja" onclick="borrarTodo()">CE</button>
      <button class="btn naranja" onclick="borrarUltimo()">C</button>
      <button class="btn rojo" onclick="cambiarSigno()">±</button>
      <button class="btn rojo" onclick="agregarOperador('%')">%</button>

      <button class="btn azul" onclick="agregarNumero('7')">7</button>
      <button class="btn azul" onclick="agregarNumero('8')">8</button>
      <button class="btn azul" onclick="agregarNumero('9')">9</button>
      <button class="btn rojo" onclick="agregarOperador('/')">÷</button>

      <button class="btn azul" onclick="agregarNumero('4')">4</button>
      <button class="btn azul" onclick="agregarNumero('5')">5</button>
      <button class="btn azul" onclick="agregarNumero('6')">6</button>
      <button class="btn rojo" onclick="agregarOperador('*')">×</button>

      <button class="btn azul" onclick="agregarNumero('1')">1</button>
      <button class="btn azul" onclick="agregarNumero('2')">2</button>
      <button class="btn azul" onclick="agregarNumero('3')">3</button>
      <button class="btn rojo" onclick="agregarOperador('-')">-</button>

      <button class="btn azul" onclick="agregarNumero('0')">0</button>
      <button class="btn azul" onclick="agregarNumero('.')">.</button>
      <button class="btn verde" onclick="calcularResultado()">=</button>
      <button class="btn rojo" onclick="agregarOperador('+')">+</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
